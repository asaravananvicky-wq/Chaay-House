{% extends 'base.html' %}
{% block title %}My Profile — Chaay House{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="auth-card">
        <h2 class="mb-4">My Profile</h2>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name</label>
              {{ form.first_name }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              {{ form.email }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              {{ form.phone }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Pincode</label>
              {{ form.pincode }}
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              {{ form.address }}
            </div>
            <div class="col-md-6">
              <label class="form-label">City</label>
              {{ form.city }}
            </div>
          </div>
          <button type="submit" class="btn-tea mt-4">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

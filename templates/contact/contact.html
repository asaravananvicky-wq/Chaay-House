{% extends 'base.html' %}
{% block title %}Contact Us — Chaay House{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="section-title text-center">
        <span class="eyebrow">Get in Touch</span>
        <h2>Contact Us</h2>
      </div>
      <div class="auth-card">
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              {{ form.name }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              {{ form.email }}
            </div>
            <div class="col-12">
              <label class="form-label">Subject</label>
              {{ form.subject }}
            </div>
            <div class="col-12">
              <label class="form-label">Message</label>
              {{ form.message }}
            </div>
          </div>
          <button type="submit" class="btn-tea mt-4">Send Message</button>
        </form>
      </div>
      <div class="text-center mt-4 text-muted">
        <p class="mb-1"><i class="fa-solid fa-location-dot me-2"></i>12 MG Road, Chennai, TN</p>
        <p class="mb-1"><i class="fa-solid fa-phone me-2"></i>+91 98765 43210</p>
        <p><i class="fa-solid fa-envelope me-2"></i>hello@chaayhouse.example</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
